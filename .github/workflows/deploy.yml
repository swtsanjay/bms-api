name: Build Push Deploy

on:
  push:
    branches:
      - main

env:
  ECR_REPOSITORY: bms-api
  CONTAINER_NAME: bms-api
  PORT: 4000

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY .

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push Docker Image to ECR
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin 878910478930.dkr.ecr.us-east-1.amazonaws.com

            docker pull 878910478930.dkr.ecr.us-east-1.amazonaws.com/bms-api:latest

            docker stop bms-api || true
            docker rm bms-api || true

            docker run -d \
            --name bms-api \
            -p 4000:4000 \
            --env-file /home/ec2-user/bms-api.env \
            --restart unless-stopped \
            878910478930.dkr.ecr.us-east-1.amazonaws.com/bms-api:latest

            docker exec bms-api npm run migrate:latest

            sleep 5

            docker system prune -a --volumes -f